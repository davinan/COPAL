[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copal"
version = "0.1.0"
description = "Co-folding ranking of protein-ligand pairs across AlphaFold 3, Boltz2, and RosettaFold3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Davi Nakajima An" },
]
keywords = [
    "alphafold3",
    "boltz",
    "rosettafold",
    "structure-prediction",
    "ligand-ranking",
    "luxr",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm>=4.65",
    "biopython>=1.81",
    "biotite>=0.40",
    "gemmi>=0.6",
    "rdkit>=2023.9",
    "trueskill>=0.4.5",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "ipywidgets>=7.6",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
copal = "copal.cli:app"

[project.urls]
"Homepage" = "https://github.com/davinan/COPAL"
"Issues" = "https://github.com/davinan/COPAL/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/copal", "src/ralph"]

[tool.hatch.build.targets.wheel.force-include]
"src/copal/runner/scripts" = "copal/runner/scripts"
"src/copal/config" = "copal/config"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
